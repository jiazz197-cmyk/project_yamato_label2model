title: 边界框目标检测
type: community
group: 计算机视觉
order: 3
image: /static/templates/object-detection-with-bounding-boxes.png
details: |
  <h1>在目标周围绘制边界框</h1>
  <dl>
    <dt>行业应用</dt>
    <dd>autonomous driving, self driving cars, traffic monitoring, aviation, flight tracking, airport security, surveillance, security cameras, retail analytics, inventory management, warehouse automation, logistics, fleet management, pedestrian detection, obstacle detection, license plate detection, baggage screening, quality control, defect detection, medical imaging</dd>
    <dt>相关模型</dt>
    <dd>YOLO, R-CNN, SSD, Faster R-CNN, RetinaNet, FCOS</dd>
    <dt>领域术语</dt>
    <dd>bbox</dd>
  </dl>
config: |
  <View>
    <Image name="image" value="$image"/>
    <RectangleLabels name="label" toName="image">
      <Label value="飞机" background="green"/>
      <Label value="汽车" background="blue"/>
    </RectangleLabels>
  </View>
