title: 文档检索
type: community
group: 排序与评分
image: /static/templates/document-retrieval.png
details: |
  <h1>选择与查询相关的文档</h1>
  <dl>
    <dt>行业应用</dt>
    <dd>legal research, academic research, customer support, knowledge management, enterprise search, medical literature, patent search, compliance documents, technical documentation, regulatory research, due diligence, case law research</dd>
    <dt>相关模型</dt>
    <dd>information retrieval, semantic search, vector search, TF-IDF, BM25, dense retrieval</dd>
    <dt>领域术语</dt>
    <dd>relevance ranking, search quality, precision and recall, retrieval evaluation, query matching</dd>
  </dl>
config: |
  <View>
    <Text name="query" value="$query" />
    <Header value="选择与查询相关的文档:" />
    <View style="display: flex">
      <View style="width:50%">
        <Text name="text1" value="$text1" />
        <Text name="text2" value="$text2" />
        <Text name="text3" value="$text3" />
      </View>
      <View>
        <Choices name="selection" toName="query" required="true" choice="multiple">
          <Choice value="一个" />
          <Choice value="两个" />
          <Choice value="两个" />
        </Choices>
      </View>
    </View>
  </View>
